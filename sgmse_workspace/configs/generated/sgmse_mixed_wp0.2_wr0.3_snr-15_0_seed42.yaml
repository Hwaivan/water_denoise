experiment:
  name: sgmse_mixed_wp0.2_wr0.3_snr-15_0_seed42
  output_dir: runs/sgmse_mixed_wp0.2_wr0.3_snr-15_0_seed42
  seed: 42
  deterministic: true
data:
  data_mode: on_the_fly
  sample_rate: 16000
  segment_seconds: 2.5
  train_manifest: /data/huayifan/water_denoise/data/ShipsEar-12class_W5H1/train_16k_signal.list
  valid_manifest: /data/huayifan/water_denoise/data/ShipsEar-12class_W5H1/valid/list/valid_snr_-5dB.list
  test_manifest: /data/huayifan/water_denoise/data/ShipsEar-12class_W5H1/test/list/valid_snr_-5dB.list
  noise_manifest: /data/huayifan/water_denoise/data/ShipsEar-12class_W5H1/train_16k_noise.list
  snr_min: -15.0
  snr_max: 0.0
  mono: true
  num_workers: 4
  segment_validation: false
  silence_threshold: 1.0e-08
  shared_peak_limit: null
  noise_mode: mixed
  white_noise_probability: 0.2
  white_noise_ratio: 0.3
stft:
  n_fft: 510
  win_length: 510
  hop_length: 128
  window: hann
  center: true
  normalized: false
  onesided: true
compression:
  alpha: 0.5
  beta: 0.15
  crop_frames: 256
sde:
  T: 1.0
  t_eps: 0.03
  gamma: 1.5
  sigma_min: 0.05
  sigma_max: 0.5
  variance_floor: 1.0e-12
model:
  name: ncsnpp
  input_channels: 4
  output_channels: 2
  base_channels: 128
  channel_multipliers:
  - 1
  - 1
  - 2
  - 2
  - 2
  - 2
  - 2
  num_res_blocks: 2
  attention_resolutions:
  - 16
  image_size: 256
  dropout: 0.0
  fourier_scale: 16.0
  fir_kernel:
  - 1
  - 3
  - 3
  - 1
  skip_rescale: true
  progressive_input: true
  progressive_output: true
sampler:
  num_steps: 30
  predictor: euler_maruyama
  corrector: annealed_langevin
  corrector_steps: 1
  corrector_step_size: 0.5
  use_ema: true
training:
  optimizer: adam
  learning_rate: 0.0001
  weight_decay: 0.0
  epochs: 160
  batch_size: 6
  amp: false
  gradient_clip_norm: 1.0
  ema_decay: 0.999
  scheduler: reduce_on_plateau
  scheduler_factor: 0.5
  scheduler_patience: 5
  min_lr: 1.0e-07
  save_every: 10
  resume: null
  auxiliary_waveform_weight: 0.0
validation:
  eval_interval: 5
  max_sampling_batches: 2
  seed: 1234
metrics:
  alignment_policy: crop
  eps: 1.0e-08
  min_db: null
  max_db: null
logging:
  tensorboard: true
  jsonl: true
distributed:
  use_ddp: true
  data_parallel: false
inference:
  seed: 1234
  chunk_seconds: null
  overlap_seconds: 0.5
  fallback_on_oom: true
